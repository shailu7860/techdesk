version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
        # Deploy gate: nothing ships if lint, types or unit tests fail.
        - npm run lint
        - npm run typecheck
        - npm test
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build/client
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*

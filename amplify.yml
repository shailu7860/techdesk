version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Deploys the chat function and writes amplify_outputs.json (custom.chat_url) for the frontend build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        # Deploy gate: nothing ships if lint, types or unit tests fail.
        - npm run lint
        - npm run typecheck
        - npm test
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build/client
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
